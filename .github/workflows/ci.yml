name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # gofmt is checked rather than run: a formatting difference should fail
      # the build, not be silently rewritten under the author.
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
      # Module 11 adds: docker build, Trivy scan, SBOM (syft), cosign sign,
      # and push to GHCR. Kept minimal until there is something to deploy.
