# Redis lives in its own namespace, not in a tenant's.
#
# It is shared infrastructure: one instance holds every tenant's queue under a
# separate key. That is a deliberate cost decision - the whole argument of this
# project is that per-tenant idle cost should approach zero, and a Redis per
# tenant would put a permanent floor under it. Isolation between tenants comes
# from the key namespace and, in Module 4, from NetworkPolicy.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          # Redis is one of only two things in this design that must stay
          # resident, so its footprint is part of the fixed cost the cost
          # meter reports. Keeping it small is keeping that floor low.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: platform
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
