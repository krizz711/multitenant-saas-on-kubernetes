# One namespace per tenant. Every quota, network rule and secret attaches here,
# and deleting the namespace removes the customer entirely.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    tenant: tenant-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tenant-a
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels:
        app: api
        tenant: tenant-a
    spec:
      containers:
        - name: api
          image: multitenant/api:dev
          # Without IfNotPresent, Kubernetes tries to pull a locally built
          # image from a registry that has never heard of it, and the pod sits
          # in ImagePullBackOff. This single line is the most common way a
          # k3d side-loaded image appears broken.
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: REDIS_URL
              value: redis://redis.platform.svc.cluster.local:6379/0
          # requests are what the scheduler reserves and what the cost meter
          # bills against; limits are the ceiling. The gap between them is
          # what Module 8 exploits to let batch work yield.
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          # Both probes hit /healthz, which sits outside the admission
          # middleware precisely so the kubelet can reach it without a tenant
          # header. Readiness gates traffic; liveness restarts a wedged pod.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tenant-a
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: http
