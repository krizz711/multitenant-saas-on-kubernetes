# Defaults for one tenant. Every install overrides `tenant`, and the tier
# controls how much of the cluster that customer may consume.
tenant: tenant-a

# tier drives the quota and, from Module 8, the priority class. Modelling
# tiers now is what makes the cost-per-tenant result interesting later:
# a premium tenant costs more to serve, and the meter should show it.
tier: standard

images:
  api: multitenant/api:dev
  worker: multitenant/worker:dev
  pullPolicy: IfNotPresent

redisUrl: redis://redis.platform.svc.cluster.local:6379/0

# CPU requests are the cgroup WEIGHT, not just a scheduling hint: under
# contention each container gets CPU in proportion to its request. So the
# request numbers below are the actual C3 mechanism, and they were previously
# backwards - the worker asked for 200m against the API's 100m, meaning batch
# work won twice the CPU of the request a human was waiting on.
#
# The pattern now is low guaranteed share, high ceiling for batch: the worker
# may use a whole core when the node is idle, but yields immediately when the
# API wants CPU.
api:
  replicas: 1
  resources:
    requests: { cpu: 300m, memory: 64Mi }
    limits:   { cpu: "1",  memory: 256Mi }

worker:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    # Generous ceiling on purpose: the job must be able to saturate a core,
    # because C3 is about what happens when it competes for one.
    limits:   { cpu: "1", memory: 256Mi }

# The ceiling on everything this customer can ask for, summed across the
# namespace. This is the mechanism that stops one tenant consuming the cluster
# - the "no tenant has a ceiling" half of problem P2, applied to CPU.
quota:
  standard:
    requestsCpu: "1"
    limitsCpu: "2"
    requestsMemory: 512Mi
    limitsMemory: 1Gi
    pods: "8"
  premium:
    requestsCpu: "2"
    limitsCpu: "4"
    requestsMemory: 1Gi
    limitsMemory: 2Gi
    pods: "16"

# Scale-to-zero (Module 6, claim C1).
scaling:
  enabled: true
  maxReplicas: 3
  listLength: 2
  redisAddress: redis.platform.svc.cluster.local:6379
  # Tuned to the compressed experiment clock - see the comment in
  # templates/scaledobject.yaml. Production values would be far larger.
  pollingInterval: 5
  cooldownPeriod: 20

# Token gateway (Module 7, claim C2).
#
# The budget is per tier because that is what a tier IS in a real SaaS: a
# premium customer buys a bigger allowance. It also makes the cost meter in
# Module 9 interesting - two tenants on different tiers should produce visibly
# different bills.
gateway:
  tokenBudget:
    standard: 50000
    premium: 200000
  # Chosen from the measured similarity distribution, not picked to flatter the
  # hit rate. gateway_cache_similarity records every lookup's best score so the
  # cut-off can be justified from data.
  cacheThreshold: "0.90"
  cacheMaxEntries: 200
  cacheTTL: 24h

# Fair scheduling (Module 8, claim C3).
#
# Setting enabled=false reproduces the "before" configuration: no priority
# classes at all. Combined with equal CPU requests via --set, that is the
# unprotected baseline the experiment measures against.
scheduling:
  enabled: true
  interactivePriorityClass: tenant-interactive
  batchPriorityClass: tenant-batch

# Pin a tenant's pods to one node. Empty in normal operation - the scheduler
# should place pods.
#
# The C3 experiment sets this because CPU shares are enforced by the kernel
# cgroup hierarchy ON A NODE. Two pods on different nodes do not compete for
# the same cores, so the mechanism being measured would simply not engage and
# the experiment would show nothing while looking like it ran correctly.
nodeSelector: {}
