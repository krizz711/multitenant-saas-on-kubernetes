{{- $schema := .Values.tenant | replace "-" "_" -}}
{{- /*
  The tenant's own database password.

  Generated once and then preserved: `lookup` reads the Secret already in the
  cluster so a `helm upgrade` does not mint a new password, which would leave
  the running pods authenticating with a value the database no longer accepts.
  lookup returns empty during `helm template`, so rendering offline still works.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Values.tenant (printf "%s-db" .Values.tenant) -}}
{{- $password := "" -}}
{{- if $existing -}}
{{-   $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{-   $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tenant }}-db
  namespace: {{ .Values.tenant }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  # search_path pins every query from this tenant to its own schema, so an
  # unqualified table name can only ever resolve inside it.
  url: postgres://{{ $schema }}:{{ $password }}@postgres.platform.svc.cluster.local:5432/saas?search_path={{ $schema }}&sslmode=disable
---
{{/*
  The same password, in the platform namespace, so the provisioning Job below
  can set it on the role. A Job cannot read a Secret from another namespace.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tenant }}-db
  namespace: platform
type: Opaque
stringData:
  password: {{ $password | quote }}
