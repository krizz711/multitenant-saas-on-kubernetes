# Default deny: once any NetworkPolicy selects a pod, everything not explicitly
# allowed is refused. This is what stops tenant A reaching tenant B.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.tenant }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Allow this tenant's own pods to talk to each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-tenant
  namespace: {{ .Values.tenant }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tenant: {{ .Values.tenant }}
---
# Allow Prometheus to scrape.
#
# This rule is not optional and it is the one everybody forgets. A default-deny
# policy silently blocks the monitoring namespace, every scrape target goes
# down, and the dashboards empty out with no error anywhere near the cause. The
# lesson generalises: locking down a namespace breaks your own observability
# first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: {{ .Values.tenant }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Allow the ingress controller in.
#
# default-deny blocks Traefik exactly as it blocks another tenant - it lives in
# kube-system, which is not this namespace. Without this rule every request
# through the ingress returns 502 while the pods sit perfectly healthy, which
# is the same class of self-inflicted outage as blocking Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: {{ .Values.tenant }}
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
