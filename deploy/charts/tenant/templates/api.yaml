apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Values.tenant }}
  labels: { app: api, tenant: {{ .Values.tenant }} }
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels:
        app: api
        tenant: {{ .Values.tenant }}
        tier: {{ .Values.tier }}
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: REDIS_URL, value: {{ .Values.redisUrl | quote }} }
            - { name: TENANT,    value: {{ .Values.tenant | quote }} }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Values.tenant }}
  # A ServiceMonitor selects a Service by the Service's OWN labels, not by
  # spec.selector. Omit these and the scrape target silently never appears.
  labels: { app: api, tenant: {{ .Values.tenant }} }
spec:
  selector: { app: api }
  ports:
    # Named because a ServiceMonitor selects the port by name.
    - { name: http, port: 8000, targetPort: http }
